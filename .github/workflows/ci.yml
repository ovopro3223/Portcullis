name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Every job does the same five things, in this order:
#   1. configure with warnings as errors (-Werror) on every target,
#   2. build,
#   3. unit tests,
#   4. compile-fail tests (snippets that must NOT compile; --no-tests=error makes
#      the job fail if they ever stop being registered),
#   5. bench-smoke: configure with -DPORTCULLIS_BUILD_BENCH=ON and build bench/.
#
# -DCMAKE_COMPILE_WARNING_AS_ERROR=ON puts -Werror on every target without
# touching CMAKE_CXX_FLAGS, so it composes with the sanitizer flags that the
# clang-asan preset sets there. tests/ and bench/ add -Wall -Wextra themselves.

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        preset: [clang-release, gcc-release, clang-asan]
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y clang g++ cmake ninja-build
      - name: Configure (-Werror)
        run: cmake --preset ${{ matrix.preset }} -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Unit tests
        run: ctest --preset ${{ matrix.preset }} --output-on-failure -E '^cf\.'
      - name: Compile-fail tests (must not compile)
        run: ctest --preset ${{ matrix.preset }} --output-on-failure -R '^cf\.' --no-tests=error
      - name: bench-smoke (configure with PORTCULLIS_BUILD_BENCH=ON, build bench/, run it briefly)
        run: |
          cmake --preset ${{ matrix.preset }} -DCMAKE_COMPILE_WARNING_AS_ERROR=ON -DPORTCULLIS_BUILD_BENCH=ON
          cmake --build --preset ${{ matrix.preset }} --target portcullis_bench
          python3 scripts/gen-benchmarks.py --bench build/${{ matrix.preset }}/bench/portcullis_bench --iterations 20 --output "$RUNNER_TEMP/BENCHMARKS.md"
          head -n 30 "$RUNNER_TEMP/BENCHMARKS.md"

  windows-msys2:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          install: >-
            mingw-w64-clang-x86_64-clang
            mingw-w64-clang-x86_64-compiler-rt
            mingw-w64-clang-x86_64-lld
            mingw-w64-clang-x86_64-cmake
            mingw-w64-clang-x86_64-ninja
      - name: Configure (-Werror)
        run: cmake --preset msys2-clang64 -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
      - name: Build
        run: cmake --build --preset msys2-clang64
      - name: Unit tests
        run: ctest --preset msys2-clang64 --output-on-failure -E '^cf\.'
      - name: Compile-fail tests (must not compile)
        run: ctest --preset msys2-clang64 --output-on-failure -R '^cf\.' --no-tests=error
      - name: bench-smoke (configure with PORTCULLIS_BUILD_BENCH=ON, build bench/, run it briefly)
        run: |
          cmake --preset msys2-clang64 -DCMAKE_COMPILE_WARNING_AS_ERROR=ON -DPORTCULLIS_BUILD_BENCH=ON
          cmake --build --preset msys2-clang64 --target portcullis_bench
          ./build/msys2-clang64/bench/portcullis_bench.exe --iterations 20
